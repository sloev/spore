[package]
name = "spore"
version = "0.1.0"
edition = "2021"
description = "SPORE v1 — Store-and-forward Planetary Opportunistic Relay Envelope: a reference implementation"
license = "Unlicense"

[dependencies]
ed25519-dalek = "=2.1.1"
crypto_box = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
blake2 = "0.10"
rand = "0.8"
# Pin transitive deps to versions compatible with Rust 1.75 (no edition2024).
zeroize = "=1.7.0"
base64ct = "=1.6.0"

[profile.release]
opt-level = 2
