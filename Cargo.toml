[package]
name = "spore"
version = "0.2.0"
edition = "2021"
# The oldest toolchain that builds this, verified rather than asserted: `cargo
# +1.75 test` passes. It matters because CONTINUITY.md promises a rebuild on
# whatever machine survives, and that is not a promise you can keep on a toolchain
# you never tried. `Cargo.lock` is kept at version 3 for the same reason — a v4
# lockfile cannot even be *parsed* by 1.75, which silently defeated the dependency
# pins below.
rust-version = "1.75"
description = "SPORE v1 — Store-and-forward Planetary Opportunistic Relay Envelope: a reference implementation"
license = "Unlicense"

# `cdylib` builds libspore.{so,dylib,dll} exporting the C ABI in src/ffi.rs,
# which the Python / Go / JS wrappers under bindings/ load. `lib` (rlib) keeps
# the crate usable as a normal Rust dependency and by the binary.
[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
ed25519-dalek = "=2.1.1"
crypto_box = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
blake2 = "0.10"
rand = "0.8"
# Pin transitive deps to versions compatible with Rust 1.75 (no edition2024).
zeroize = "=1.7.0"
base64ct = "=1.6.0"
# `zeroize` is a facade; the derive macro is a *separate* crate that the pin above
# does not constrain, and zeroize_derive 1.5 moved to edition2024 — which needs a
# far newer Cargo than 1.75 and so defeated the pin it sits behind. Nothing here
# uses `#[derive(Zeroize)]`; it arrives via chacha20poly1305/crypto_box enabling
# the feature. Pinned rather than disabled because the feature belongs to those
# crates, not to us.
zeroize_derive = "=1.4.2"

# On the web (wasm32) OsRng needs a randomness source. We use getrandom's
# `custom` backend and route it to a JS import (`spore_fill_random`) so the wasm
# stays wasm-bindgen-free and instantiable with plain WebAssembly. See src/wasm.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

# The ICMP raw-socket runner needs socket()/SOCK_RAW, which std does not expose.
# libc is already in the tree (via rand/getrandom), so this declares an existing
# crate rather than adding one, and only on Linux where the runner compiles.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
