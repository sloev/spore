[package]
name = "spore"
version = "0.7.0"
edition = "2021"
# The oldest toolchain that builds this, verified rather than asserted: `cargo
# +1.85 test` passes (the MSRV CI job runs exactly that). It matters because
# CONTINUITY.md promises a rebuild on whatever machine survives, and that is not a
# promise you can keep on a toolchain you never tried.
#
# The floor was 1.75 until the optional `bridge-iroh` feature landed: `iroh-base`
# requires `zeroize ≥1.9`, and because Cargo resolves optional deps too, that pulls
# `zeroize` (and its edition-2024 `zeroize_derive` 1.5) into the *core* build via
# chacha20poly1305/crypto_box — both need Rust 1.85. Raising the floor to 1.85 was a
# deliberate decision to admit iroh; the default build and every non-iroh bridge
# still build offline on 1.85. `iroh` itself needs 1.91 and is exercised only by the
# dedicated `iroh` CI job on stable, never on the MSRV toolchain. `Cargo.lock` is at
# version 4 (needs Cargo ≥1.78, well under the 1.85 floor); it was pinned to v3 only
# to stay parseable by the old 1.75 floor, a constraint the bump retires.
rust-version = "1.85"
description = "SPORE v1 — Store-and-forward Planetary Opportunistic Relay Envelope: a reference implementation"
license = "Unlicense"

# `cdylib` builds libspore.{so,dylib,dll} exporting the C ABI in src/ffi.rs,
# which the Python / Go / JS wrappers under bindings/ load. `lib` (rlib) keeps
# the crate usable as a normal Rust dependency and by the binary.
[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
ed25519-dalek = "=2.1.1"
crypto_box = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
blake2 = "0.10"
rand = "0.8"
base64ct = "=1.6.0"
# `zeroize` is bumped to 1.x (≥1.9) to satisfy the optional iroh bridge's
# `iroh-base`, which pulls it into the *core* build via chacha20poly1305/crypto_box.
# That is what moved the MSRV floor off 1.75 (see rust-version above): zeroize 1.9's
# derive pulls `zeroize_derive` 1.5, which is edition2024. Nothing here uses
# `#[derive(Zeroize)]`; the feature belongs to those crypto crates, not to us.
zeroize = "1"

# Optional: the iroh QUIC peer-to-peer bridge (feature `bridge-iroh`). A large async
# tree, off by default and off the default/MSRV CI matrix — exercised only by the
# dedicated `iroh` CI job on stable. `dep:` gating keeps every other build lean.
# Marked experimental (🧪) in BRIDGES.md.
iroh = { version = "1", optional = true }
# Only reachable through `bridge-iroh`, and already in that feature's tree via
# iroh itself — so it adds no crates and cannot move the default MSRV.
bytes = { version = "1", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time"] }

[features]
# QUIC peer-to-peer envelope bridge over iroh (hole punch + relay fallback). iroh's
# default `tls-ring` feature selects the rustls `ring` crypto provider, which the
# `Minimal`/`N0` presets install on the endpoint builder — no direct rustls dep here.
bridge-iroh = ["dep:iroh", "dep:tokio", "dep:bytes"]

# On the web (wasm32) OsRng needs a randomness source. We use getrandom's
# `custom` backend and route it to a JS import (`spore_fill_random`) so the wasm
# stays wasm-bindgen-free and instantiable with plain WebAssembly. See src/wasm.rs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

# The ICMP raw-socket runner needs socket()/SOCK_RAW, which std does not expose.
# libc is already in the tree (via rand/getrandom), so this declares an existing
# crate rather than adding one, and only on Linux where the runner compiles.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
