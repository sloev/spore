<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="SPORE — Antenna + Seed">
  <!-- Antenna + Seed: a sturdy radio antenna rising from a seed/soil form.
       The only SPORE brand icon. No mushroom. See docs/VISUALDESIGN.md §6. -->
  <!-- Seed/soil base (a grounded half-ellipse) -->
  <path fill="#4b5320" d="M4,17a8,3 0 1,0 16,0a8,3 0 1,0 -16,0Z"/>
  <!-- Soil line under the seed -->
  <path fill="#2a2f1c" d="M4,17a8,3 0 1,0 16,0L20,18a8,3 0 1,1 -16,0Z"/>
  <!-- Antenna mast -->
  <path fill="#39ff14" d="M11.3,17h1.4v-9h-1.4Z"/>
  <!-- Antenna tip (broadcast dot) -->
  <path fill="#39ff14" d="M12,3a2,2 0 1,0 0,0.01Z"/>
  <!-- Two broadcast waves either side of the tip -->
  <path fill="#39ff14" d="M6.5,6.5a1,1 0 0,1 1.4,1.4a4,4 0 0,0 0,5.6a1,1 0 0,1 -1.4,1.4a6,6 0 0,1 0,-8.4Z"/>
  <path fill="#39ff14" d="M17.5,6.5a1,1 0 0,0 -1.4,1.4a4,4 0 0,1 0,5.6a1,1 0 0,0 1.4,1.4a6,6 0 0,0 0,-8.4Z"/>
  <!-- Seed sprout (two small leaves at the base of the mast) -->
  <path fill="#57C785" d="M9.5,13c-1.5,0 -2.5,1 -2.5,2.5c1.5,0 2.5,-1 2.5,-2.5Z"/>
  <path fill="#57C785" d="M14.5,13c1.5,0 2.5,1 2.5,2.5c-1.5,0 -2.5,-1 -2.5,-2.5Z"/>
</svg>
