name: release bump

# The one human action in versioning: pick major or minor and press the button.
#
# Everything else is derived. This workflow computes the next version from
# `Cargo.toml` and opens a PR. Release notes come from git history.
# Merging that PR is what cuts the release — `android.yml` sees a `Cargo.toml`
# version with no tag behind it and creates the tag *and* publishes the release in
# the same job it is already running.
#
# Two GitHub behaviours shape this, and ignoring either produces a green job that
# does nothing:
#
#   * `master` is a protected branch, so `GITHUB_TOKEN` cannot push a commit to it.
#     Hence a PR rather than a direct push — which is also a reviewable diff, which
#     is what "a human bumps the version" ought to mean.
#   * **A tag pushed by `GITHUB_TOKEN` does not trigger workflows.** GitHub blocks
#     that to prevent recursion. So nothing here relies on a tag firing the release
#     build; the build that is already running does the publishing. Five release
#     findings in this repo (S-021, S-025, S-026, S-029, S-030) were all mechanisms
#     assumed to fire and verified only by the artefacts they failed to produce.
#   * **Actions cannot open pull requests unless the repository allows it.** Off by
#     default, and I missed it — the first run did every step, pushed the branch, and
#     failed on the last line. The PR is therefore best-effort: the branch is what
#     matters, and a link is printed if the API refuses.
#   * **A PR opened by a bot needs one click before its checks run.** GitHub holds
#     the run in "Action required — awaiting approval from a maintainer". This is a
#     click, not a wall: press *Approve and run* on the release PR and CI proceeds
#     normally. If that click ever becomes tiresome, delete the `gh pr create` call
#     and open the PR from the printed link instead — a human-opened PR needs no
#     approval.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to increase'
        required: true
        type: choice
        options:
          - minor
          - major

permissions:
  contents: write
  pull-requests: write

# Two bumps at once would race on the same branch name and the same
# heading. Queue them.
concurrency:
  group: release-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Compute the next version
        id: v
        run: |
          set -euo pipefail
          cur=$(awk '/^\[package\]/{p=1} p && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.toml)
          if [ -z "$cur" ]; then echo "::error::could not read version from Cargo.toml"; exit 1; fi
          ma=${cur%%.*}; rest=${cur#*.}; mi=${rest%%.*}
          case "${{ inputs.bump }}" in
            major) ma=$((ma + 1)); mi=0 ;;
            minor) mi=$((mi + 1)) ;;
            *) echo "::error::unknown bump '${{ inputs.bump }}'"; exit 1 ;;
          esac
          # Patch is always 0 on a tagged release; rolling builds generate their own
          # patch from the merge time, so a human never picks one.
          next="${ma}.${mi}.0"
          if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then
            echo "::error::tag v${next} already exists"; exit 1
          fi
          echo "cur=$cur" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Bumping $cur -> $next (${{ inputs.bump }})"

      # A release with nothing in it is a release nobody needs. The changelog file
      # used to carry this check; git history carries it now, and cannot drift
      # from what actually merged.
      - name: Refuse a release with no commits behind it
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$prev" ]; then
            echo "No previous tag — first release, nothing to compare against."
            exit 0
          fi
          log=$(git log --no-merges --format='- %s' "${prev}..HEAD")
          if [ -z "$log" ]; then
            echo "::error::No commits since ${prev} — there is nothing to release."
            exit 1
          fi
          echo "Releasing with:"; echo "$log"

      - name: Bump Cargo.toml and Cargo.lock
        run: |
          set -euo pipefail
          next='${{ steps.v.outputs.next }}'
          # Only the [package] version: the first `version =` after that header.
          awk -v v="$next" '
            /^\[package\]/ { p = 1 }
            p && /^version = / && !done { print "version = \"" v "\""; done = 1; next }
            { print }
          ' Cargo.toml > Cargo.toml.new && mv Cargo.toml.new Cargo.toml
          # Keep the lockfile in step without touching dependency versions.
          cargo update -p spore --offline 2>/dev/null || cargo update -p spore
          grep -n '^version = ' Cargo.toml | head -1

      - name: Open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          next='${{ steps.v.outputs.next }}'
          branch="release/v${next}"
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add Cargo.toml Cargo.lock
          git commit -m "Release ${next}"
          # Force-with-lease: a previous run that got as far as pushing leaves the
          # branch behind, and a retry must not die on it. The branch is bot-owned
          # and derived entirely from master, so there is nothing to preserve.
          git push -u --force-with-lease origin "$branch"
          # `gh pr create` needs "Allow GitHub Actions to create and approve pull
          # requests" (Settings → Actions → General → Workflow permissions). It is
          # off by default, and I missed it: this workflow's first run did all the
          # work, pushed the branch, and then failed on the last line with
          # "GitHub Actions is not permitted to create or approve pull requests".
          #
          # So the PR is best-effort. The branch is pushed either way, which is the
          # part that matters; if the API refuses, print the one-click compare link
          # into the job summary rather than throwing away a good bump. Turning the
          # setting on upgrades this from a link to an actual PR, and nothing else
          # changes.
          if ! gh pr create --base master --head "$branch" \
            --title "Release ${next}" \
            --body "$(printf '%s\n' \
              "Bumps \`Cargo.toml\` ${{ steps.v.outputs.cur }} → **${next}** (\`${{ inputs.bump }}\`). Release notes are generated from git history at publish time." \
              "" \
              "**Merging this cuts the release.** \`android.yml\` runs on every push to \`master\`; it will see that \`Cargo.toml\` names a version with no tag behind it, create \`v${next}\`, and publish the release with the APK in the same job." \
              "" \
              "Nothing here relies on a tag push triggering a build — a tag pushed by \`GITHUB_TOKEN\` does not trigger workflows, so that would silently do nothing." \
              "" \
              "---" \
              "_Generated by [Claude Code](https://claude.ai/code)_")"; then
            url="https://github.com/${GITHUB_REPOSITORY}/compare/master...${branch}?expand=1"
            echo "::warning::Could not open the PR automatically — the branch is pushed and ready."
            {
              echo "### Release ${next} — branch pushed, PR not opened"
              echo ""
              echo "\`${branch}\` carries the version bump. GitHub Actions is not permitted to"
              echo "create pull requests in this repository, so open it yourself:"
              echo ""
              echo "**[Open the release PR](${url})**"
              echo ""
              echo "To have this step open it next time, enable *Settings → Actions → General →"
              echo "Workflow permissions → Allow GitHub Actions to create and approve pull requests*."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
