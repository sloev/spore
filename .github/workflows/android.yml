name: android

# Builds the SPORE Android APK (Rust JNI via cargo-ndk + Gradle) and releases it:
#   * push to master  -> a rolling pre-release "<current version>+<date>" at the
#                        moving `rolling` tag (the current version is the latest
#                        git tag; date is the build date).
#   * push a v* tag    -> a normal release AT that tag — the next current version,
#                        which rolling builds then track from.
#   * pull_request     -> just build a debug APK artifact.
# A new workflow file (not frozen); does not touch ci.yml / pr-guard.yml.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write   # create/update releases and move the rolling tag

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags for `git describe` (the current version)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK + platform + build-tools
        run: |
          yes | sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Compute version + release kind
        id: ver
        run: |
          date=$(date -u +'%Y.%m.%d')
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Tagged: this tag IS the (next) current version.
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "kind=tagged" >> "$GITHUB_OUTPUT"
          else
            # Rolling: current version (latest tag, or v0.0) + build date.
            cur=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0)
            echo "name=${cur}+${date}" >> "$GITHUB_OUTPUT"
            echo "kind=$([ "${{ github.event_name }}" = "push" ] && echo rolling || echo none)" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/jni

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the Rust JNI libraries (.so per ABI)
        working-directory: android/jni
        run: >
          cargo ndk
          -t arm64-v8a -t armeabi-v7a -t x86_64
          -o ../app/src/main/jniLibs
          build --release

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble APK (release for master/tags; debug for PRs)
        working-directory: android
        env:
          # With a release keystore in secrets, release builds are properly
          # signed; otherwise they fall back to the debug key so the APK is still
          # installable. See android/app/build.gradle.kts.
          SPORE_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SPORE_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          SPORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SPORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          SPORE_VERSION_NAME: ${{ steps.ver.outputs.name }}
          SPORE_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gradle :app:assembleDebug
          else
            gradle :app:assembleRelease
          fi

      - name: Locate + name the APK
        id: apk
        working-directory: android
        run: |
          src=$(find app/build/outputs/apk -name '*.apk' | head -1)
          out="spore-${{ steps.ver.outputs.name }}.apk"
          cp "$src" "$out"
          echo "path=android/$out" >> "$GITHUB_OUTPUT"

      # A release asset nobody can verify is a release asset nobody should trust.
      # CONTINUITY.md already asks operators to check a rebuild against a printed
      # hash; publishing the hash is the other half of that bargain.
      - name: Checksum the APK
        id: sums
        working-directory: android
        run: |
          apk="$(basename '${{ steps.apk.outputs.path }}')"
          sha256sum "$apk" > "$apk.sha256"
          echo "sha=$(cut -d' ' -f1 "$apk.sha256")" >> "$GITHUB_OUTPUT"
          echo "sums=android/$apk.sha256" >> "$GITHUB_OUTPUT"
          cat "$apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: spore-apk
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.sums.outputs.sums }}

      - name: Rolling release (master)
        if: steps.ver.outputs.kind == 'rolling'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: SPORE rolling ${{ steps.ver.outputs.name }}
          prerelease: true
          make_latest: false
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.sums.outputs.sums }}
          body: >
            Rolling SPORE Android node — ${{ steps.ver.outputs.name }} (built from
            master). Tracks the current version (latest tag) plus the build date;
            updated on every merge. For a stable build see the latest tagged release.
            SHA-256 `${{ steps.sums.outputs.sha }}` — verify with
            `sha256sum -c spore-*.apk.sha256`.

      - name: Tagged release (v*)
        if: steps.ver.outputs.kind == 'tagged'
        uses: softprops/action-gh-release@v2
        with:
          name: SPORE ${{ github.ref_name }}
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.sums.outputs.sums }}
          body: >
            SPORE Android node — ${{ github.ref_name }}. The current version;
            rolling master builds are versioned from it until the next tag.
            SHA-256 `${{ steps.sums.outputs.sha }}` — verify with
            `sha256sum -c spore-*.apk.sha256`.
