name: android

# Builds the SPORE Android APK (Rust JNI via cargo-ndk + Gradle) and releases it:
#   * push to master  -> a rolling pre-release "<major>.<minor>.<stamp>+<sha>" at the
#                        moving `rolling` tag, plus a dated nightly-<date> release
#                        (last five kept).
#   * push a v*/V* tag -> a normal release AT that tag; Cargo.toml must already
#                        carry the same major.minor or the build fails.
#   * pull_request     -> just build a debug APK artifact.
# A new workflow file (not frozen); does not touch ci.yml / pr-guard.yml.
on:
  push:
    branches: [master]
    # Both cases. Glob matching here is case-sensitive, so `tags: ['v*']` alone
    # silently ignored `V0.1.0` and `V0.2.0`: the tags existed, GitHub made
    # releases for them, and no build ever ran — leaving a non-prerelease "latest"
    # with zero assets, which is a worse failure than having no release at all,
    # because `releases/latest/download/spore-android.apk` then 404s from a page
    # that looks real.
    tags: ['v*', 'V*']
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'Cargo.toml'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write   # create/update releases and move the rolling tag

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need tags for `git describe` (the current version)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK + platform + build-tools
        run: |
          yes | sdkmanager "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"

      # Version scheme.
      #
      #   rolling / nightly:  <major>.<minor>.<YYYYMMDDHHMM>+<short sha>
      #   tagged:             the tag, verbatim
      #
      # `<major>.<minor>` comes from `Cargo.toml` and is the **only** part a human
      # touches — bumping it is a deliberate act, made in a commit, reviewable. The
      # patch is the merge time and the build metadata is the commit, so every
      # rolling build is uniquely and monotonically named and points at the exact
      # source it came from. Nothing here derives a version from a git tag: the
      # previous scheme did, found the `rolling` tag this workflow creates itself,
      # and produced "SPORE rolling rolling+2026.07.27".
      #
      # 12-digit patch numbers are valid semver (numeric, no leading zero).
      - name: Compute version + release kind
        id: ver
        run: |
          date=$(date -u +'%Y.%m.%d')
          stamp=$(date -u +'%Y%m%d%H%M')
          sha7=$(git rev-parse --short=7 HEAD)
          # The package version, not a dependency's: first `version =` after [package].
          pkg=$(awk '/^\[package\]/{p=1} p && /^version = /{gsub(/[",]/,"",$3); print $3; exit}' Cargo.toml)
          mm=${pkg%.*}
          if [ -z "$mm" ]; then echo "::error::could not read version from Cargo.toml"; exit 1; fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # A tag is the human's version bump, so Cargo.toml must already agree
            # with it. When they disagree the rolling builds are versioned from
            # Cargo.toml and the newest release from the tag, and the two drift
            # apart without anything complaining — V0.2.0 was cut while Cargo.toml
            # still said 0.1.0. Fail loudly instead.
            tag_mm=$(printf '%s' "${{ github.ref_name }}" | sed -E 's/^[vV]//; s/^([0-9]+\.[0-9]+).*/\1/')
            if [ "$tag_mm" != "$mm" ]; then
              echo "::error::tag ${{ github.ref_name }} is ${tag_mm}.x but Cargo.toml says ${pkg}."
              echo "Bump Cargo.toml's major.minor to ${tag_mm} and re-tag, or tag ${mm}.x instead."
              exit 1
            fi
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "kind=tagged" >> "$GITHUB_OUTPUT"
          else
            echo "name=${mm}.${stamp}+${sha7}" >> "$GITHUB_OUTPUT"
            echo "kind=$([ "${{ github.event_name }}" = "push" ] && echo rolling || echo none)" >> "$GITHUB_OUTPUT"
          fi
          # Android versionCode must fit a signed 32-bit int, so it stays a date.
          echo "code=$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "date=${date}" >> "$GITHUB_OUTPUT"
          echo "base=${mm}" >> "$GITHUB_OUTPUT"
          echo "pkg=${pkg}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32 is for the standalone-node release asset built below, not the
          # APK — cargo-ndk never touches it.
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/jni

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the Rust JNI libraries (.so per ABI)
        working-directory: android/jni
        run: >
          cargo ndk
          -t arm64-v8a -t armeabi-v7a -t x86_64
          -o ../app/src/main/jniLibs
          build --release

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble APK (release for master/tags; debug for PRs)
        working-directory: android
        env:
          # With a release keystore in secrets, release builds are properly
          # signed; otherwise they fall back to the debug key so the APK is still
          # installable. See android/app/build.gradle.kts.
          SPORE_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SPORE_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          SPORE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SPORE_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
          SPORE_VERSION_NAME: ${{ steps.ver.outputs.name }}
          SPORE_VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gradle :app:assembleDebug
          else
            gradle :app:assembleRelease
          fi

      # Two names for one file. The versioned name is the archive copy on a tagged
      # release; the constant name is what a download link can point at, because a
      # URL cannot contain tomorrow's date. `spore-android.apk` is the only reason
      # docs/APPS.md can offer a real download button instead of "go to the
      # releases page and figure out which file is newest".
      - name: Locate + name the APK
        id: apk
        working-directory: android
        run: |
          src=$(find app/build/outputs/apk -name '*.apk' | head -1)
          out="spore-${{ steps.ver.outputs.name }}.apk"
          cp "$src" "$out"
          cp "$src" spore-android.apk
          echo "path=android/$out" >> "$GITHUB_OUTPUT"

      # A release asset nobody can verify is a release asset nobody should trust.
      # CONTINUITY.md already asks operators to check a rebuild against a printed
      # hash; publishing the hash is the other half of that bargain.
      - name: Checksum the APK
        id: sums
        working-directory: android
        run: |
          apk="$(basename '${{ steps.apk.outputs.path }}')"
          sha256sum "$apk" > "$apk.sha256"
          sha256sum spore-android.apk > spore-android.apk.sha256
          echo "sha=$(cut -d' ' -f1 "$apk.sha256")" >> "$GITHUB_OUTPUT"
          echo "sums=android/$apk.sha256" >> "$GITHUB_OUTPUT"
          cat "$apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: spore-apk
          path: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.sums.outputs.sums }}

      # MISSION.md: "rebuild without us" is a promise every release should carry,
      # not just the APK. These two run only when a release is actually about to
      # be cut (not on a PR's debug-only build, which never reaches the steps
      # below) — no point spending the time otherwise. The wasm build needs the
      # network (crates.io) the same as any first build does, so it runs before
      # vendoring — `cargo vendor`'s config redirects *every* subsequent build to
      # the local vendor/ directory, and there's no need to find out the hard way
      # whether that vendor set, resolved without ever building the wasm32
      # target in this job, actually covers it.
      - name: Build the standalone web node (release asset)
        if: steps.ver.outputs.kind == 'rolling' || steps.ver.outputs.kind == 'tagged'
        run: |
          cargo build --release --lib --target wasm32-unknown-unknown
          node web/build-standalone.mjs
          # CI's own ci.yml job already asserts this file makes zero external
          # requests; nothing new to verify here, just carry the same file.

      # `make-offline-bundle.sh --tar` is also run by supply-chain.yml's own
      # "offline bundle" job, which exists to *prove* the vendor-and-build-
      # offline promise stays true — this step reuses exactly that script
      # rather than a second implementation, so there is one place that promise
      # can go stale. Unlike that job, this one's tarball is a release asset,
      # not a CI artifact that expires: CONTINUITY.md's "Repo + vendor/" seed
      # row previously meant "run this script yourself"; from this release
      # onward it also means "or just download it".
      - name: Build the offline source bundle (release asset)
        if: steps.ver.outputs.kind == 'rolling' || steps.ver.outputs.kind == 'tagged'
        run: |
          # The script tars up the whole working tree as source; a build
          # product has no business inside a bundle whose whole point is "the
          # source, and nothing a build produces" (its own words), so the
          # standalone node built above steps out of the way and back once
          # packing is done.
          mv web/spore-standalone.html /tmp/spore-standalone.html
          ./scripts/make-offline-bundle.sh --tar
          mv /tmp/spore-standalone.html web/spore-standalone.html
          # A constant name alongside the versioned one, same pattern as the
          # APK's spore-android.apk — so /releases/latest/download/... and
          # /releases/download/rolling/... resolve without knowing the version.
          src=$(ls spore-offline-*.tar.gz | grep -v '\.sha256$' | head -1)
          cp "$src" spore-offline-bundle.tar.gz
          sha256sum spore-offline-bundle.tar.gz > spore-offline-bundle.tar.gz.sha256

      # Clear the release's assets rather than deleting the release.
      #
      # This used to be `gh release delete rolling --cleanup-tag` followed by a
      # recreate. That works most of the time and is racy: deleting a tag and
      # recreating it a second later leaves GitHub reconciling two operations on
      # the same ref, and on its first run the nightly came out of it with a live
      # tag and no release at all (S-029). Deleting only the assets keeps the tag
      # and the release identity untouched, which removes the race and still leaves
      # exactly one APK behind.
      #
      # The cost is `published_at` stops tracking the build, since an in-place
      # update never moves it. The release *name* carries the version and the body
      # carries the commit, so the build time is still legible — it is the sidebar
      # date that lags, and that is a smaller lie than a release that vanishes.
      - name: Clear the rolling release's assets
        if: steps.ver.outputs.kind == 'rolling'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view rolling --json assets --jq '.assets[].name' 2>/dev/null \
            | while read -r a; do
                [ -n "$a" ] || continue
                echo "removing stale asset $a"
                gh release delete-asset rolling "$a" --yes || true
              done

      - name: Rolling release (master)
        if: steps.ver.outputs.kind == 'rolling'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling
          name: SPORE rolling ${{ steps.ver.outputs.name }}
          prerelease: true
          make_latest: false
          # Constant filenames only: this release is replaced every merge, and the
          # download links in docs/APPS.md point straight at these names.
          files: |
            android/spore-android.apk
            android/spore-android.apk.sha256
            web/spore-standalone.html
            spore-offline-bundle.tar.gz
            spore-offline-bundle.tar.gz.sha256
          body: |
            Rolling SPORE Android node — **${{ steps.ver.outputs.name }}**, built from
            `master` at ${{ github.sha }}. Replaced on every merge, so this page always
            holds exactly one APK: the current one.

            **[⬇ spore-android.apk](https://github.com/sloev/spore/releases/download/rolling/spore-android.apk)**
            — a permanent link that always serves the newest rolling build.

            SHA-256 `${{ steps.sums.outputs.sha }}` — verify with
            `sha256sum -c spore-android.apk.sha256`.

            Need to go back a few days? The `nightly-*` releases keep the last five
            dated builds.

            ---

            Every release here also carries the means to rebuild it without this
            repository, this site, or crates.io existing (see
            [`MISSION.md`](https://github.com/sloev/spore/blob/master/docs/MISSION.md)):

            - **[⬇ spore-standalone.html](https://github.com/sloev/spore/releases/download/rolling/spore-standalone.html)**
              — the whole browser node, one file, zero network requests.
            - **[⬇ spore-offline-bundle.tar.gz](https://github.com/sloev/spore/releases/download/rolling/spore-offline-bundle.tar.gz)**
              — this source tree plus every dependency it needs, vendored; unpack
              and `cargo build --offline` works with no registry.

      # Dated history, five deep. The `rolling` release above is a moving pointer
      # and deliberately holds only the current APK — which is no help when a build
      # breaks something and you want yesterday's. One release per day (a second
      # merge the same day updates that day's), pruned below.
      # Same treatment for today's nightly: clear its assets, keep the release.
      #
      # The versioned filename embeds a minute-level stamp and the commit sha, so a
      # second merge the same day uploads a *new* name rather than overwriting one —
      # 2026-07-27 held four assets after two merges (S-026). Clearing first leaves
      # one build per day, which is what "nightly" is supposed to mean.
      - name: Clear today's nightly assets
        if: steps.ver.outputs.kind == 'rolling'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="nightly-${{ steps.ver.outputs.date }}"
          gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null \
            | while read -r a; do
                [ -n "$a" ] || continue
                echo "removing stale asset $a"
                gh release delete-asset "$tag" "$a" --yes || true
              done

      - name: Nightly release (master) — dated
        if: steps.ver.outputs.kind == 'rolling'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ steps.ver.outputs.date }}
          name: SPORE nightly ${{ steps.ver.outputs.date }}
          prerelease: true
          make_latest: false
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.sums.outputs.sums }}
          body: |
            Dated nightly — **${{ steps.ver.outputs.name }}**, built from `master` at
            ${{ github.sha }}. Kept as one of the last five nightlies so a bad build
            can be rolled back from; for the current build use
            [`rolling`](https://github.com/sloev/spore/releases/tag/rolling).

            One day, one build: a later merge the same day replaces this, so what is
            here is that day's *last* master. Use an earlier date to go further back.

            SHA-256 `${{ steps.sums.outputs.sha }}`.

      # Retention. Without this the nightlies grow without bound — the accumulation
      # bug that made the old rolling release hold four days of APKs, just moved up a
      # level. Sorted by tag name, which for `nightly-YYYY.MM.DD` is chronological
      # and, unlike `createdAt`, does not shift when a release is updated in place.
      - name: Keep only the last 5 nightlies
        if: steps.ver.outputs.kind == 'rolling'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stale=$(gh release list --limit 200 --json tagName \
            --jq '[.[].tagName | select(startswith("nightly-"))] | sort | reverse | .[5:] | .[]')
          if [ -z "$stale" ]; then
            echo "nothing to prune"
            exit 0
          fi
          echo "$stale" | while read -r tag; do
            [ -n "$tag" ] || continue
            echo "pruning $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done

      # Cut the tagged release when Cargo.toml names a version with no tag.
      #
      # This is the other half of `release.yml`. That workflow opens a PR bumping
      # `Cargo.toml`; merging it lands here, and *this* step creates the tag and
      # publishes the release — in the job that is already running.
      #
      # It deliberately does not push a tag and wait for the `tags:` trigger to fire
      # a second build. A tag pushed by `GITHUB_TOKEN` does not trigger workflows, so
      # that would be a green job that produced nothing: the exact shape of S-025,
      # S-026 and S-029. `gh release create` makes the tag and the release together.
      - name: Cut the tagged release if Cargo.toml names a new version
        if: steps.ver.outputs.kind == 'rolling'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android
        run: |
          set -euo pipefail
          ver='${{ steps.ver.outputs.pkg }}'
          tag="v${ver}"
          # Check BOTH cases before creating. Git tags are case-sensitive and so is
          # `gh release view`, so looking up only "v0.3.0" missed an existing
          # "V0.3.0" and published a second release for the same version (S-030).
          # That is the S-025 trap — a v/V mismatch — reproduced inside the fix for
          # S-025, which is why this loop exists rather than a single lookup.
          for existing in "v${ver}" "V${ver}"; do
            if gh release view "$existing" >/dev/null 2>&1; then
              echo "${ver} is already released as ${existing} — nothing to cut."
              exit 0
            fi
          done
          # The archive copy carries the version; the constant name is what
          # /releases/latest/download can point at.
          cp spore-android.apk "spore-${tag}.apk"
          sha256sum "spore-${tag}.apk" > "spore-${tag}.apk.sha256"
          # Release notes: the commits since the previous tag, then the standing
          # caveats. Written to a file so newlines survive. Git history is the
          # record — there is no changelog file to drift from what merged.
          prev=$(git -C .. describe --tags --abbrev=0 --match 'v*' --exclude "$tag" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            git -C .. log --no-merges --format='- %s' "${prev}..HEAD" > notes.md
            echo "" >> notes.md
            echo "[Full diff](https://github.com/sloev/spore/compare/${prev}...${tag})" >> notes.md
          else
            git -C .. log --no-merges --format='- %s' -20 > notes.md
          fi
          cat >> notes.md <<'NOTE'

          ---

          **[⬇ spore-android.apk](https://github.com/sloev/spore/releases/latest/download/spore-android.apk)**
          — a permanent link that always serves the newest stable release.

          This number versions the **distribution**, not the protocol. The SPORE v1
          wire format and the crate's API shape are frozen and unaffected by it.

          Before you rely on it: no radio bridge has been verified against real
          hardware (every 🧪 in
          [BRIDGES.md](https://github.com/sloev/spore/blob/master/docs/BRIDGES.md)),
          and the **Still open** section of
          [SECURITY_FINDINGS.md](https://sloev.github.io/spore/security.html) lists
          what is known and unfixed. Builds are debug-signed until a release keystore
          is configured, so Android will warn about an unknown developer.

          ---

          Every release also carries the means to rebuild it without this
          repository, this site, or crates.io existing (see
          [MISSION.md](https://github.com/sloev/spore/blob/master/docs/MISSION.md)):
          the standalone browser node (`spore-standalone.html`, one file, zero
          network requests) and a source bundle with every dependency vendored
          in (`spore-offline-bundle.tar.gz` — unpack and `cargo build --offline`
          works with no registry).
          NOTE
          echo "SHA-256 \`$(cut -d' ' -f1 "spore-${tag}.apk.sha256")\`" >> notes.md
          # `gh release create` uploads by basename, so these need no copying —
          # `../` here is the same relative-to-CWD reference the `git -C ..` log
          # uses a few lines up. The glob picks up both the versioned and
          # constant-named bundle copies built two steps ago.
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "SPORE $tag" \
            --notes-file notes.md \
            "spore-${tag}.apk" "spore-${tag}.apk.sha256" \
            spore-android.apk spore-android.apk.sha256 \
            ../web/spore-standalone.html \
            ../spore-offline-*.tar.gz ../spore-offline-*.tar.gz.sha256
          echo "cut $tag"

      # A tagged release keeps both names: the versioned one is the archive copy
      # (each tag is its own release, so nothing accumulates), and the constant one
      # makes `/releases/latest/download/spore-android.apk` resolve — the stable
      # counterpart of the rolling link.
      - name: Tagged release (v*)
        if: steps.ver.outputs.kind == 'tagged'
        uses: softprops/action-gh-release@v2
        with:
          name: SPORE ${{ github.ref_name }}
          # Append: a tag usually already has GitHub's generated "What's Changed",
          # and the caveats below belong under it, not instead of it.
          append_body: true
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.sums.outputs.sums }}
            android/spore-android.apk
            android/spore-android.apk.sha256
            web/spore-standalone.html
            spore-offline-*.tar.gz
            spore-offline-*.tar.gz.sha256
          body: |
            SPORE Android node — **${{ github.ref_name }}**. The current version;
            rolling `master` builds are versioned from it until the next tag.

            **[⬇ spore-android.apk](https://github.com/sloev/spore/releases/latest/download/spore-android.apk)**
            — a permanent link that always serves the newest *stable* release.

            SHA-256 `${{ steps.sums.outputs.sha }}` — verify with
            `sha256sum -c spore-${{ github.ref_name }}.apk.sha256`.

            ---

            This number versions the **distribution**, not the protocol. The SPORE v1
            wire format and the `spore` crate's API are frozen at 1.x and unaffected
            by it.

            Before you rely on it: no radio bridge has been verified against real
            hardware (every 🧪 in
            [BRIDGES.md](https://github.com/sloev/spore/blob/master/docs/BRIDGES.md)),
            and the **Still open** section of
            [SECURITY_FINDINGS.md](https://sloev.github.io/spore/security.html) lists
            what is known and unfixed. Builds are debug-signed until a release
            keystore is configured, so Android will warn about an unknown developer.

            ---

            Every release also carries the means to rebuild it without this
            repository, this site, or crates.io existing (see
            [MISSION.md](https://github.com/sloev/spore/blob/master/docs/MISSION.md)):
            the standalone browser node (`spore-standalone.html`, one file, zero
            network requests) and a source bundle with every dependency vendored
            in (`spore-offline-bundle.tar.gz` — unpack and `cargo build --offline`
            works with no registry).
