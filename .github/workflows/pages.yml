name: GitHub Pages

# Build the docs site (site/home.md + docs/*.md + a few root files) and the live
# wasm demo, then deploy to GitHub Pages. Runs on the main branches, this
# reference branch, and on manual dispatch.
#
# Keep these paths in step with the `pages` array in site/build.mjs — a rendered
# source that is not listed here means an edit that never reaches the site.
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "site/**"
      - "web/**"
      - "bindings/README.md"
      - "reference/README.md"
      - "src/**"
      - "Cargo.*"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer run cancel an in-progress one; never interrupt a live deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ hashFiles('Cargo.lock') }}

      - name: Build wasm node
        run: cargo build --release --lib --target wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Render docs site
        working-directory: site
        run: |
          npm install --no-audit --no-fund
          node build.mjs

      - name: Build the single-file node (seed) — it is also the live demo
        run: |
          node web/build-standalone.mjs
          # One file, one URL: /demo/ is the live page. "Download" links to
          # the same URL with a `download` attribute (site/build.mjs), so the
          # same ~720 KB payload is never shipped twice under two paths.
          mkdir -p _site/demo
          cp web/spore-standalone.html _site/demo/index.html

      - name: Build the printable Seed Sheet (fountain-coded QR)
        working-directory: site
        run: |
          node seed/build-seedsheet.mjs
          cp ../web/spore-seedsheet.html ../_site/spore-seedsheet.html

      - name: Add .nojekyll
        run: touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
