name: MSRV

# Cargo.toml declares `rust-version` (1.85 as of the iroh bridge), and CONTINUITY.md
# promises a rebuild on whatever machine survives. Neither is worth anything unless
# something checks it, so this job installs exactly that toolchain and builds+tests
# the default features on it — iroh is off by default, so the floor is the core
# crypto tree, not iroh's 1.91.
#
# The floor was 1.75 until `bridge-iroh` landed: `iroh-base` requires `zeroize ≥1.9`,
# and Cargo resolves optional deps too, so `zeroize` 1.9 (+ its edition-2024
# `zeroize_derive` 1.5) is pulled into the *core* build via chacha20poly1305 —
# both need 1.85. `Cargo.lock` is version 4 (needs Cargo ≥1.78, under the 1.85 floor);
# the last step here proves this toolchain still parses it.
#
# A separate workflow rather than a job in ci.yml, because ci.yml is inside the
# freeze guard's regex and this does not need to be.
on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test -n "$v" || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Deliberately not `-D warnings`: a newer lint landing in a future release is
      # not an MSRV break, and failing on it would make this job noisy rather than
      # meaningful. The question here is only "does the oldest supported toolchain
      # still build and pass".
      - name: Build and test on the declared MSRV
        run: cargo test --all-targets
      - name: Lockfile must stay parseable by this toolchain
        run: cargo metadata --format-version 1 --locked > /dev/null
