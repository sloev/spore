name: supply chain

# The checks that guard what SPORE *depends on* rather than what it does.
#
# A separate workflow rather than jobs inside ci.yml, which the freeze guard's
# regex covers — these are additive and should not need a major-version label to
# adjust.
on:
  push:
    branches: [master, develop]
  pull_request:
  schedule:
    # Advisories land on their own schedule, not on ours. A dependency that was
    # clean when merged can stop being clean without anybody touching the repo,
    # so this runs daily as well as per-PR.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-audit
      - name: Known vulnerabilities in the dependency tree
        # RUSTSEC-2024-0436: `paste` is unmaintained (not a vulnerability). It is a
        # compile-time-only proc-macro helper and enters the tree *only* through the
        # optional `bridge-iroh` feature, which is off by default and off the shipped
        # binary — the default supply chain never sees it. cargo-deny already exempts
        # it (`unmaintained = "workspace"`); this keeps cargo-audit consistent.
        #
        # RUSTSEC-2026-0253: `lru` 0.18.1 has an unsound `LruCache::pop()` (potential
        # use-after-free if a drop panics). It enters the tree only through the
        # optional `bridge-iroh` feature (iroh's dependency chain), which is off by
        # default. Tracked for a real fix upstream; ignored here so a transitive
        # advisory on an off-by-default feature does not gate every PR.
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0253

  policy:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-deny
      # Licences, banned crates, wildcard versions and source registries — see
      # deny.toml for why each matters to a project that promises an offline
      # rebuild from a vendored bundle.
      - name: Licence and source policy
        run: cargo deny check

  bindings:
    name: bindings in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `bindings/generate.py` produces spore.h and the Python/Go/JS wrappers from
      # spec.json. Nothing checked that the committed output still matched, so
      # spec.json or src/ffi.rs could drift from the wrappers silently — and
      # spore.h is a frozen file, which makes a silent drift worse than a loud one.
      - name: Regenerate and diff
        run: |
          python3 bindings/generate.py
          if ! git diff --exit-code -- bindings/; then
            echo "::error::bindings/ is stale — run: python3 bindings/generate.py"
            exit 1
          fi
          echo "bindings match spec.json"

  design-tokens:
    name: design tokens in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `design/generate.py` emits the palette into the docs site's CSS, the
      # standalone node's inlined CSS, Android's Compose Palette and
      # VISUALDESIGN's contrast tables. The same hexes used to be hand-typed in
      # each, with the WCAG ratios re-typed as comments beside them — so a
      # palette change meant a manual four-way audit, and the ratios could
      # silently stop describing the colours they sat next to.
      #
      # The script also fails on its own if a pairing stops matching the grade
      # tokens.json claims for it, in either direction: a colour that is no
      # longer readable, or a "forbidden" pair that has quietly become fine.
      - name: Regenerate and diff
        run: |
          python3 design/generate.py
          if ! git diff --exit-code -- design/ site/ web/ android/ docs/; then
            echo "::error::design tokens are stale — run: python3 design/generate.py"
            exit 1
          fi
          echo "every surface matches design/tokens.json"

  offline:
    name: offline bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `CONTINUITY.md` promises a rebuild with no registry, and S-010 was that
      # promise being false. `make-offline-bundle.sh` made it true, but a script
      # that only ever ran once on one machine is a claim again — so run it here,
      # and let the build prove itself the way the document says it should.
      - name: Vendor dependencies and prove the build needs no registry
        run: ./scripts/make-offline-bundle.sh --tar
      - name: Cold build with an empty CARGO_HOME
        # The real test: not "offline works here", but "offline works somewhere
        # that has never fetched these crates".
        env:
          CARGO_HOME: ${{ runner.temp }}/empty-cargo-home
        run: cargo build --offline --quiet
      - name: Publish the bundle and its checksum
        uses: actions/upload-artifact@v4
        with:
          name: spore-offline-bundle
          path: |
            spore-offline-*.tar.gz
            spore-offline-*.tar.gz.sha256
          if-no-files-found: error
