name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings # warnings fail the build — keep it clean

jobs:
  # Build + test the library and daemon on every desktop OS. The core is plain
  # std, so this proves the single-binary portability claim.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Worked examples (reimplementation guide reference values)
        run: cargo run --example worked
      - name: T0 reference decoder — vectors in sync + pure-Python conformance
        if: runner.os == 'Linux'
        run: |
          cargo run --example gen_vectors > reference/vectors.json
          git diff --exit-code reference/vectors.json \
            || (echo "reference/vectors.json is stale — run: cargo run --example gen_vectors > reference/vectors.json"; exit 1)
          python3 reference/test_t0.py
      - name: Docs/code in sync — no documented value may drift from the code
        if: runner.os == 'Linux'
        run: python3 scripts/check_docs_sync.py
      # android/jni is its own workspace (so the root build ignores it), which
      # means the checks above never reach it. Lint it here on Linux; the Android
      # cross-build in android.yml only proves it compiles for the device.
      - name: Android JNI crate — fmt + clippy
        if: runner.os == 'Linux'
        run: |
          cargo fmt --check --manifest-path android/jni/Cargo.toml
          cargo clippy --manifest-path android/jni/Cargo.toml --all-targets
      # The other half of the RNS bridge; nothing else exercises it.
      - name: Reticulum companion parses
        if: runner.os == 'Linux'
        run: python3 -m py_compile tools/reticulum_companion.py

  # The browser target: prove the core still compiles to wasm with its single
  # import, which the web/ node ABI and demo depend on.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build wasm node
        run: cargo build --release --lib --target wasm32-unknown-unknown
      - name: Check the wasm has exactly one import
        run: |
          node -e '
            const fs = require("fs");
            const b = fs.readFileSync("target/wasm32-unknown-unknown/release/spore.wasm");
            const imports = WebAssembly.Module.imports(new WebAssembly.Module(b));
            console.log(JSON.stringify(imports));
            if (imports.length !== 1 || imports[0].name !== "spore_fill_random") {
              throw new Error("expected exactly one import env.spore_fill_random");
            }
          '
      - name: Web loopback end-to-end test
        run: node web/test.mjs

      - name: Transport codec tests (kiss, meshtastic, audio wire formats)
        run: node web/codec-test.mjs

      - name: Real WebSocket relay end-to-end test
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          node ws-test.mjs

      - name: Build + verify the single-file node is self-contained
        run: |
          node web/build-standalone.mjs
          # No external module imports and no remote asset references may remain.
          if grep -nE '^\s*(import|export) ' web/spore-standalone.html; then
            echo "standalone has live import/export statements"; exit 1
          fi
          if grep -nE '(src|href)="https?://' web/spore-standalone.html; then
            echo "standalone references a remote asset"; exit 1
          fi

      - name: Seed Sheet — fountain code + full decode round-trip
        working-directory: site
        run: |
          npm install --no-audit --no-fund
          node seed/fountain.test.mjs
          node seed/seedsheet.test.mjs
          node seed/build-seedsheet.mjs

      # The docs site renders here as well as in pages.yml, because its build
      # fails on a broken internal link or a dead anchor and that has to be
      # caught on the pull request, not after the deploy. A doc that renames a
      # heading and orphans six cross-references still looks correct in review.
      - name: Docs site builds and every internal link resolves
        working-directory: site
        run: node build.mjs

  # The embedded target (Roadmap M8/E1): prove the unmodified core still
  # cross-compiles and links for ESP32-S3, and report what it costs. ESP32-S3 is
  # Xtensa, which upstream Rust does not target, so this runs in Espressif's
  # image rather than installing a toolchain — see esp32/README.md.
  esp32:
    runs-on: ubuntu-latest
    container: espressif/idf-rust:esp32s3_latest
    env:
      # Deliberately replaces the workflow-level RUSTFLAGS rather than adding to
      # it. Cargo lets an env RUSTFLAGS override `rustflags` in .cargo/config.toml
      # wholesale, so inheriting `-D warnings` here would silently drop
      # `--cfg espidf_time64` and build against a 32-bit time_t on an IDF that
      # uses 64. It also drops `-D warnings` on purpose: this target emits an
      # unavoidable "dropping unsupported crate type `cdylib`" for the core's
      # lib/cdylib pair, which is correct behaviour, not a defect to fail on.
      RUSTFLAGS: --cfg espidf_time64
    steps:
      - uses: actions/checkout@v4
      # ESP-IDF itself is built from source on a cold cache (~10 min); .embuild is
      # where esp-idf-sys unpacks and builds it.
      - uses: actions/cache@v4
        with:
          path: |
            esp32/.embuild
            esp32/target
          key: esp32-${{ hashFiles('esp32/Cargo.lock', 'esp32/.cargo/config.toml') }}
          restore-keys: esp32-
      - name: Cross-compile the firmware for ESP32-S3
        working-directory: esp32
        run: cargo build --release
      - name: Report flash and RAM footprint
        working-directory: esp32
        run: |
          BIN=target/xtensa-esp32s3-espidf/release/spore-esp32
          readelf -h "$BIN" | grep -q Xtensa || { echo "not an Xtensa binary"; exit 1; }
          # Exact section-name match, not a substring one: .flash.rodata_noload
          # and .iram0.text_end would both match a looser pattern. The image's awk
          # is mawk, so no strtonum() — hex is converted in the shell instead.
          sz() {
            readelf -W -S "$BIN" | sed 's/^ *\[[ 0-9]*\] *//' \
              | awk -v n="$1" '$1 == n { print $5; exit }'
          }
          # Flash holds .flash.text + .flash.rodata + the initialisers for
          # .dram0.data; internal SRAM holds .iram0.text + .dram0.data + .bss.
          flash=$(( 16#$(sz .flash.text) + 16#$(sz .flash.rodata) + 16#$(sz .dram0.data) ))
          ram=$(( 16#$(sz .iram0.text) + 16#$(sz .dram0.data) + 16#$(sz .dram0.bss) ))
          printf 'flash (app):  %9d bytes\n' "$flash"
          printf 'internal RAM: %9d bytes\n' "$ram"
