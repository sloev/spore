# Example SPORE node config.  Run with:  cargo run -- spore.example.yaml
#
# Every bridge listed here shares one node and relays to the others, so this
# process is a gateway between a LAN, some folders, a TCP link, and a mesh.
# You can list as many of each kind as you like.

petname: riverside
topics: [news, weather]

# SPORE Direct — the low-latency plane, off unless you say where this node is
# reachable. Signalling (OFFER/ANSWER) rides the ordinary sealed mesh path; the
# media then go straight over UDP.
#
#   direct: 7500                 # bind :7500 and advertise this host's primary IPv4
#   direct: 203.0.113.5:7500     # …or say exactly how a peer should reach you
#
# LAN-only for now, and deliberately so: a node cannot yet discover its own
# reflexive address, so what you write here is what peers are told. Crossing NAT
# needs the P-Direct-NAT track (STUN + hole-punch + relay), which is not built.
#
# The daemon has no control surface to start a pipe from, so name a peer to keep
# one open to — the 16-hex-digit address the other node prints at startup:
#
#   direct-to: a1b2c3d4e5f60718
#
# Reflexive locators (P-Direct-NAT step 2). Ask an echo where you appear from
# outside and offer that address too; any SPORE daemon running `stun:` is one,
# and so is any public STUN server:
#
# Extra locators you are reachable at, comma-separated. Typically this node's
# address on an IP-layer overlay — Yggdrasil, cjdns, a VPN — which already routes,
# so it needs no punch and no relay. It cannot be discovered: a routing probe
# follows the default route, and cjdns addresses sit in fc00::/8 which a
# public-internet check rightly rejects. So you declare it:
#
#   direct-also: [200:abcd::1]:7500, 10.8.0.3:7500
#
# Must be UDP-dialable. A Tor .onion or I2P .b32 is not — those are stream
# rendezvous names and would need their own medium and adapter, not a locator.
#
# SPORE Direct over iroh — the last rung, for when both ends are behind NATs
# with no LAN, IPv6 or overlay path between them. Needs a build with the
# `bridge-iroh` feature. The relay posture is a trust decision and is never
# defaulted, so you say which you want:
#
#   direct-iroh: direct-only   # hole punching only; no relay, nothing told to anyone
#   direct-iroh: n0            # n0's public relay as fallback — a real third party
#                              # that sees ciphertext, volume and timing when used
#
# iroh supports self-hosted relays, so "a relay is needed" never has to mean
# "n0's relay is needed" — but pointing at your own is iroh's own configuration.
#
#   direct-stun: 203.0.113.9:7900
#   stun: 7900                   # …and run the echo yourself, for other nodes
#
# The echo is stateless — one packet in, one out, nothing kept — which is why
# running it costs nothing and why SPORE need not depend on a third party for it.
# Knowing your outside address is still not the same as being reachable at it:
# the coordinated hole-punch is step 3 and is not built, so a pipe across NAT
# will usually still fail. The LAN locator is always preferred when both work.

bridges:
  - broadcast                # zero-config: the primary subnet's own broadcast :7373
  - udp                      # or the plain 255.255.255.255 limited broadcast
  - udp: 7374                # a second LAN segment on another port
  - folder: ./bag            # a shared folder (USB stick, Syncthing, Dropbox…)
  - folder: ./outbox         # …list as many folders as you want
  - tcp: 10.0.0.5:7373       # connect a TCP link (omit the value to listen)
  - meshtastic               # a Meshtastic WiFi-UDP mesh
  - http: 8088               # an HTTP bag: POST /spore/push, GET /spore/inv, POST /spore/want
  - audio                    # data-over-sound modem (f32 PCM on stdin/stdout)
  - reticulum                # RNS payload via tools/reticulum_companion.py (KISS on stdin/stdout)
  - ssb: ./ssb-log           # a Secure Scuttlebutt append-only log folder
  # - ax25: localhost:8001        # KISS TNC over TCP (Direwolf KISSPORT)
  # - ax25: /dev/ttyUSB0          # …or a hardware TNC on serial (stty first)
  # - tor: abc…xyz.onion          # dial a peer's onion via Tor's SOCKS proxy
  # - i2p: abc…xyz.b32.i2p        # I2P destination via the SAM bridge (:7656)
  # - copyparty: http://box:3923/bag/   # shared HTTP dir; TLS goes in a tunnel
  # - reticulum-tcp: 10.0.0.9:4242      # companion over TCP, not a pipe
  # - reticulum-udp: 0.0.0.0:0 -> 10.0.0.9:4242
  # - icmp: 192.168.1.42                # ping payloads; sudo setcap cap_net_raw+ep
