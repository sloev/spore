<!--
  Development harness for the M10-D web node.

  This is NOT the shipped artefact. The real one is web/spore-standalone.html,
  built by build-standalone.mjs, which inlines the wasm and every stylesheet so
  it makes zero external requests. This page loads them as separate files so a
  reload picks up an edit without a rebuild; it therefore needs a static server
  and the wasm built:

      cargo build --release --lib --target wasm32-unknown-unknown
      python3 -m http.server -d . 8000
      # open http://localhost:8000/web/app/

  Import order matters and mirrors hardbrut3/styles.css exactly: tokens, then
  base, then patterns, then the theme last so it can win.
-->
